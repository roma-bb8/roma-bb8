# Adds the `banner` label to a pull request that touches the banner (rules in labeler.yml).
# pull_request_target gives a token that can write labels on pull requests from forks. It is safe here
# because the job never checks out or runs code from the pull request.
name: Label

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
